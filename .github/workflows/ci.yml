name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pydantic numpy scipy h5py pyproj shapely pyyaml

      - name: Lint with ruff
        run: ruff check backend/ sonarforge/ training/ scripts/ tests/ || true

      - name: Type check with mypy
        run: mypy backend/ sonarforge/ training/ --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v
